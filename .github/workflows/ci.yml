name: EduPlatform CI (Security, Tests & Build)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-security-and-tests:
    runs-on: ubuntu-latest
    env:
      USE_SQLITE: '1'
      DEBUG: 'True'
      DJANGO_SECRET_KEY: 'ci-test-secret-key-at-least-32-chars-long-2026'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Check pending migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run security & core API test suite
        run: python manage.py test apps.tests_security --verbosity=2

  frontend-typecheck-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript strict type check
        run: npx tsc --noEmit
      - name: Production Vite build
        run: npm run build
